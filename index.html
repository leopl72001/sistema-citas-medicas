<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Citas Médicas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0b3d91;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    h2 {
      color: #0b3d91;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #0b3d91;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #082f70;
    }

    .hidden {
      display: none;
    }

    .success {
      background: #e6f7e6;
      border: 1px solid #4caf50;
      padding: 12px;
      border-radius: 8px;
      color: #2e7d32;
      margin-top: 10px;
    }

    .error {
      background: #ffe6e6;
      border: 1px solid #e53935;
      padding: 12px;
      border-radius: 8px;
      color: #b71c1c;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background: #0b3d91;
      color: white;
    }

    .logout {
      background: #d32f2f;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>Sistema de Gestión de Citas Médicas</h1>
</header>

<div class="container" id="loginSection">
  <h2>Inicio de sesión</h2>

  <label>Correo electrónico</label>
  <input type="email" id="email" placeholder="Ingrese su correo" />

  <label>Contraseña</label>
  <input type="password" id="password" placeholder="Ingrese su contraseña" />

  <button onclick="login()">Ingresar</button>

  <div id="loginMessage"></div>
</div>

<div class="container hidden" id="dashboardSection">
  <h2>Bienvenido al sistema</h2>
  <p>Desde aquí puede agendar una cita médica.</p>

  <h2>Agendar cita médica</h2>

  <label>Nombre del paciente</label>
  <input type="text" id="patientName" placeholder="Nombre completo" />

  <label>Médico</label>
  <select id="doctor">
    <option value="">Seleccione un médico</option>
    <option value="Dr. Juan Pérez - Medicina General">Dr. Juan Pérez - Medicina General</option>
    <option value="Dra. Laura Gómez - Pediatría">Dra. Laura Gómez - Pediatría</option>
    <option value="Dr. Carlos Martínez - Cardiología">Dr. Carlos Martínez - Cardiología</option>
  </select>

  <label>Fecha</label>
  <input type="date" id="date" />

  <label>Hora</label>
  <input type="time" id="time" />

  <label>Motivo de la cita</label>
  <input type="text" id="reason" placeholder="Ej: Consulta general" />

  <button onclick="bookAppointment()">Agendar cita</button>

  <div id="appointmentMessage"></div>

  <h2>Citas registradas</h2>

  <table>
    <thead>
      <tr>
        <th>Paciente</th>
        <th>Médico</th>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Motivo</th>
      </tr>
    </thead>
    <tbody id="appointmentsTable"></tbody>
  </table>

  <button class="logout" onclick="logout()">Cerrar sesión</button>
</div>

<script>
  const validUser = {
    email: "paciente@test.com",
    password: "123456"
  };

  let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("loginMessage");

    if (email === validUser.email && password === validUser.password) {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      renderAppointments();
    } else {
      message.innerHTML = '<div class="error">Correo o contraseña incorrectos.</div>';
    }
  }

  function bookAppointment() {
    const patientName = document.getElementById("patientName").value;
    const doctor = document.getElementById("doctor").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const reason = document.getElementById("reason").value;
    const message = document.getElementById("appointmentMessage");

    if (!patientName || !doctor || !date || !time || !reason) {
      message.innerHTML = '<div class="error">Todos los campos son obligatorios.</div>';
      return;
    }

    const newAppointment = {
      patientName,
      doctor,
      date,
      time,
      reason
    };

    appointments.push(newAppointment);
    localStorage.setItem("appointments", JSON.stringify(appointments));

    message.innerHTML = '<div class="success">Cita médica agendada correctamente.</div>';

    document.getElementById("patientName").value = "";
    document.getElementById("doctor").value = "";
    document.getElementById("date").value = "";
    document.getElementById("time").value = "";
    document.getElementById("reason").value = "";

    renderAppointments();
  }

  function renderAppointments() {
    const table = document.getElementById("appointmentsTable");
    table.innerHTML = "";

    appointments.forEach((appointment) => {
      table.innerHTML += `
        <tr>
          <td>${appointment.patientName}</td>
          <td>${appointment.doctor}</td>
          <td>${appointment.date}</td>
          <td>${appointment.time}</td>
          <td>${appointment.reason}</td>
        </tr>
      `;
    });
  }

  function logout() {
    document.getElementById("dashboardSection").classList.add("hidden");
    document.getElementById("loginSection").classList.remove("hidden");
  }
</script>

</body>
</html>
